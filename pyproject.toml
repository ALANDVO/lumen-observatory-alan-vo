[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-observatory"
version = "1.0.0"
description = "Actor Substrate Observatory - AI/ML agent lifecycle and telemetry observability"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Alan Vo", email = "alanvo@gmail.com"}
]
keywords = ["actor", "substrate", "observability", "telemetry", "ai", "ml", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Monitoring",
]
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "sqlalchemy==2.0.36",
  "pydantic==2.10.1",
  "pydantic-settings==2.8.1",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "python-multipart==0.0.18",
  "httpx==0.28.1",
  "prometheus-client==0.20.0",
  "opentelemetry-api==1.28.0",
  "opentelemetry-sdk==1.28.0",
  "opentelemetry-exporter-otlp==1.28.0",
  "opentelemetry-instrumentation-fastapi==0.47b0",
  "python-dotenv==1.0.1",
  "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-cov==5.0.0",
  "alembic==1.14.0",
  "psycopg2-binary==2.9.10",
  "redis==5.2.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"