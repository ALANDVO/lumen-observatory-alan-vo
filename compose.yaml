version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/lumen.db
      - APP_NAME=lumen-observatory
      - APP_VERSION=1.0.0
      - DEBUG=true
      - ENVIRONMENT=development
      - SECRET_KEY=dev-secret-change-in-production
      - OIDC_ISSUER_URL=http://127.0.0.1:8080/realms/lumen
      - OIDC_CLIENT_ID=lumen-observatory
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=http://127.0.0.1:3000/callback
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_PROVIDER=openai-compatible
      - LLM_MODEL=gpt-4o-mini
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - OTLP_ENDPOINT=http://169.254.17.1:4317
      - TELEMETRY_ENABLED=true
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - lumen-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - VITE_API_BASE=http://127.0.0.1:8000/api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - backend
    networks:
      - lumen-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USER=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - lumen-network

volumes:
  backend_data:
  keycloak_data:

networks:
  lumen-network:
    driver: bridge